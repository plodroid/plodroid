<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1B18"/>
      <stop offset="0.55" stop-color="#242420"/>
      <stop offset="1" stop-color="#1B1B18"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 40) rotate(23) scale(420 260)">
      <stop stop-color="#E8966E" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#E8966E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 290) rotate(-155) scale(420 250)">
      <stop stop-color="#C87D5C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#C87D5C" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <ellipse cx="255" cy="36" rx="315" ry="170" fill="url(#glowA)" filter="url(#blur)">
    <animate attributeName="cx" values="255;340;255" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="930" cy="290" rx="330" ry="160" fill="url(#glowB)" filter="url(#blur)">
    <animate attributeName="cx" values="930;850;930" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#shadow)">
    <rect x="92" y="66" width="1016" height="188" rx="34" fill="url(#glass)" stroke="#E6E2DA" stroke-opacity="0.12"/>
    <rect x="108" y="82" width="984" height="156" rx="26" stroke="#FFFFFF" stroke-opacity="0.04"/>
  </g>

  <circle cx="144" cy="112" r="6" fill="#C87D5C">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="165" y="119" fill="#C87D5C" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="2">ONLINE / BUILDING</text>

  <text x="600" y="174" text-anchor="middle" fill="#E6E2DA" font-size="70" font-family="Georgia, Times New Roman, serif" font-weight="400" letter-spacing="3">PLODROID</text>
  <text x="600" y="213" text-anchor="middle" fill="#B5B0A5" font-size="19" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">developer  •  tech nerd  •  minecraft creator</text>

  <g opacity="0.5">
    <circle cx="1028" cy="110" r="10" fill="#C87D5C">
      <animate attributeName="cy" values="110;101;110" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="132" r="5" fill="#E8966E">
      <animate attributeName="cy" values="132;140;132" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="146" r="4" fill="#E6E2DA" fill-opacity="0.4">
      <animate attributeName="cy" values="146;138;146" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
